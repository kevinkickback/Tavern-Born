<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tavern Born - D&amp;D Character Creator</title>
  <!-- Apply stored theme before first paint to avoid flash of wrong colours.
       Runs synchronously during HTML parse, before CSS has rendered or JS modules execute. -->
  <script vite-ignore src="./theme-init.js"></script>
  <link rel="stylesheet" href="./src/styles/accent-colors.css">
  <style>
    @font-face {
      font-family: "Cinzel Startup";
      src: url("/fonts/cinzel.ttf") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: block;
    }

    :root {
      --tb-loader-bg: #cdced6;
      --tb-loader-fg: #1c2024;
      --tb-loader-muted-fg: #535862;
      --tb-loader-track: #f0f0f3;
      --tb-loader-indicator: oklch(from var(--tb-accent-base) min(l, 0.51) c h);
    }

    :root[data-appearance="dark"],
    :root.dark {
      --tb-loader-bg: #111113;
      --tb-loader-fg: #edeef0;
      --tb-loader-muted-fg: #b0b4ba;
      --tb-loader-track: #272a2d;
      --tb-loader-indicator: oklch(from var(--tb-accent-base) max(l, 0.72) c h);
    }

    :root[data-accent="chroma"] {
      --tb-loader-indicator: var(--tb-accent-base);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--tb-loader-bg);
    }

    body {
      font-family: "Inter", sans-serif;
    }

    .startup-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--tb-loader-bg);
      color: var(--tb-loader-fg);
      font-family: system-ui, sans-serif;
      outline: none;
    }

    .startup-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid var(--tb-accent-base);
      pointer-events: none;
    }

    :root[data-platform="win32"] .startup-overlay::before {
      /* The native resize frame can cover the first row in a restored window. */
      top: 1px;
    }

    .startup-brand {
      margin-bottom: 56px;
      text-align: center;
      user-select: none;
    }

    .startup-title {
      margin: 0;
      font-family: "Cinzel Startup", serif;
      font-size: 48px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.025em;
    }

    .startup-subtitle {
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tb-loader-muted-fg);
    }

    .startup-progress {
      display: flex;
      width: 384px;
      max-width: calc(100vw - 32px);
      flex-direction: column;
      gap: 10px;
    }

    .startup-progress-slot {
      display: flex;
      height: 24px;
      align-items: center;
      justify-content: center;
    }

    .startup-track {
      position: relative;
      height: 6px;
      width: 100%;
      overflow: hidden;
      border-radius: 9999px;
      background: var(--tb-loader-track);
    }

    .startup-indeterminate {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      border-radius: 9999px;
      background: var(--tb-loader-indicator);
      animation: tb-loader-indeterminate 1.4s ease-in-out infinite;
    }

    .startup-status {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 16px;
      color: var(--tb-loader-muted-fg);
      text-align: center;
    }

    @keyframes tb-loader-indeterminate {
      0% {
        transform: translateX(-150%);
      }

      100% {
        transform: translateX(400%);
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
  <div id="root">
    <!-- Visible on first CSS paint, before React mounts -->
    <div id="tb-pre-loader" class="startup-overlay">
      <div class="startup-brand">
        <h1 id="tb-pre-loader-title" class="startup-title">Tavern Born</h1>
        <p class="startup-subtitle">5e Character Builder</p>
      </div>
      <div class="startup-progress">
        <div class="startup-progress-slot">
          <div class="startup-track">
            <div id="tb-pre-loader-bar" class="startup-indeterminate"></div>
          </div>
        </div>
        <div class="startup-status">Warming up the dice...</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
