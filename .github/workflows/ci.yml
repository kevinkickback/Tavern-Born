name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, coverage, and build
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx biome ci .
      - name: Type-check
        run: npx tsc -b
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  e2e:
    name: Browser end-to-end tests
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Build desktop application
        run: npm run build
      - name: Run Electron smoke test
        run: xvfb-run --auto-servernum npm run test:electron
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  squash-merge:
    name: Squash merge dev into main
    needs: [quality, e2e]
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Merge the checked PR revision
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const expected = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: expected.number,
            });
            if (pr.head.sha !== expected.head.sha) {
              throw new Error('The PR changed; its latest checks must pass before merging.');
            }
            // Allow failed release jobs to be retried without merging a second time.
            if (pr.merged) {
              core.setOutput('sha', pr.merge_commit_sha);
              return;
            }
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'dev' || pr.head.repo.full_name !== `${owner}/${repo}`) {
              throw new Error('The PR is no longer eligible for automatic merging.');
            }
            const { data: base } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (base.commit.sha !== expected.base.sha) {
              throw new Error('main changed during checks; update the PR before merging.');
            }
            const { data: result } = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number,
              merge_method: 'squash', sha: expected.head.sha,
            });
            if (!result.merged) {
              throw new Error(result.message);
            }
            core.setOutput('sha', result.sha);

  release:
    name: Release merged version
    needs: squash-merge
    permissions:
      contents: write
      pull-requests: read
    # GITHUB_TOKEN merges do not trigger push workflows. Call release directly.
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ needs.squash-merge.outputs.sha }}
