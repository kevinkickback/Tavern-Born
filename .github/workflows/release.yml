name: Release

on:
  workflow_call:
    inputs:
      source-sha:
        description: Squash merge commit that passed the dev to main PR checks
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source-sha:
        description: Existing release commit to rebuild and verify
        required: true
        type: string
      rebuild-existing-draft:
        description: Replace the unpublished draft and tag when the package version is unchanged
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source-sha }}
  REBUILD_EXISTING_DRAFT: ${{ inputs['rebuild-existing-draft'] || false }}

jobs:
  detect-version-change:
    name: Detect package version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare package versions
        id: version
        shell: bash
        run: |
          current_version="$(node -p "require('./package.json').version")"
          previous_version="$(
            git show "$SOURCE_SHA^:package.json" |
              node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).version))'
          )"

          if [[ "$current_version" == "$previous_version" ]]; then
            if [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
              echo "Package version remains $current_version; rebuilding its unpublished draft."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Package version remains $current_version; skipping release."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
            echo "Draft rebuild mode is only valid when the package version is unchanged." >&2
            exit 1
          else
            echo "Package version changed from $previous_version to $current_version."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release-source:
    name: Prepare release from merged PR
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require merged PR and clean Copilot review
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: process.env.SOURCE_SHA, per_page: 100,
            });
            const pull = pulls.find((candidate) =>
              candidate.merged_at &&
              candidate.merge_commit_sha === process.env.SOURCE_SHA &&
              candidate.base.ref === 'main' &&
              candidate.head.ref === 'dev' &&
              candidate.head.repo.full_name === `${owner}/${repo}`,
            );
            if (!pull) throw new Error(`Commit ${process.env.SOURCE_SHA} did not come from a merged dev -> main PR.`);

            const { requireCopilotReview } = require('./.github/scripts/copilot-review-gate.cjs');
            await requireCopilotReview({
              github,
              core,
              owner,
              repo,
              pullNumber: pull.number,
              expectedHead: pull.head.sha,
            });
      - name: Validate release version and changelog
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          previous_version="$(
            git show "$SOURCE_SHA^:package.json" |
              node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).version))'
          )"
          if [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
            node scripts/check-release.mjs
          else
            node scripts/check-release.mjs --previous-version "$previous_version"
          fi
          tag="v$version"

          if existing_sha="$(git rev-list -n 1 "$tag" 2>/dev/null)"; then
            if [[ "$existing_sha" != "$SOURCE_SHA" && "$REBUILD_EXISTING_DRAFT" != "true" ]]; then
              echo "Tag $tag already points to $existing_sha instead of $SOURCE_SHA." >&2
              exit 1
            fi
          fi

          if [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
            if is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
              if [[ "$is_draft" != "true" ]]; then
                echo "Release $tag is not an unpublished draft; refusing to replace it." >&2
                exit 1
              fi
            elif [[ "${existing_sha:-}" != "$SOURCE_SHA" ]]; then
              echo "Release $tag is missing and its tag does not point to $SOURCE_SHA; refusing to rebuild it." >&2
              exit 1
            else
              echo "Release $tag is missing after its tag was moved; resuming the interrupted draft rebuild."
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  create-release:
    name: Create draft release
    needs: release-source
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create version tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
            if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)" && [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is not an unpublished draft; refusing to replace it." >&2
              exit 1
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA" -F force=true
            echo "Moved $RELEASE_TAG to $SOURCE_SHA; the draft will be replaced immediately before builds start."
          fi

          if existing_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null)"; then
            if [[ "$existing_sha" != "$SOURCE_SHA" && "$REBUILD_EXISTING_DRAFT" != "true" ]]; then
              echo "Tag $RELEASE_TAG already points to $existing_sha instead of $SOURCE_SHA." >&2
              exit 1
            fi
            echo "Reusing existing tag $RELEASE_TAG."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA"
          fi
      - name: Extract release notes from changelog
        run: node scripts/check-release.mjs --notes-file release-notes.md
      - name: Create GitHub release draft
        shell: bash
        run: |
          if [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
            if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
              if [[ "$is_draft" != "true" ]]; then
                echo "A published release already exists for $RELEASE_TAG; refusing to replace it." >&2
                exit 1
              fi
              gh release delete "$RELEASE_TAG" --yes
            fi
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" \
              --notes-file release-notes.md --verify-tag
            exit 0
          fi

          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "A published release already exists for $RELEASE_TAG; refusing to replace it." >&2
              exit 1
            fi
            echo "Reusing existing draft release $RELEASE_TAG."
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            release_flags=(--draft --title "$RELEASE_TAG" --notes-file release-notes.md --verify-tag)
            gh release create "$RELEASE_TAG" "${release_flags[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  build:
    name: Build (${{ matrix.os }})
    needs: [release-source, create-release]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish artifacts
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: true
          # The caller retains PR context, but source validation requires a merged commit.
          PUBLISH_FOR_PULL_REQUEST: 'true'
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  verify-release:
    name: Verify draft release artifacts
    needs: [release-source, build]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      - name: Verify draft and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"

          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG is not a draft."
            exit 1
          fi

          missing=0
          require_asset() {
            local expected="$1"
            if ! grep -Fxq "$expected" <<<"$assets"; then
              echo "::error::Missing release asset: $expected"
              missing=1
            fi
          }

          require_asset "Tavern-Born-Setup-$RELEASE_VERSION.exe"
          require_asset "Tavern-Born-$RELEASE_VERSION-portable.exe"
          require_asset "Tavern-Born-$RELEASE_VERSION.AppImage"
          require_asset "tavern-born_${RELEASE_VERSION}_amd64.deb"
          require_asset 'latest.yml'
          require_asset 'latest-mac.yml'
          require_asset 'latest-linux.yml'

          if ! grep -F "Tavern-Born-$RELEASE_VERSION" <<<"$assets" | grep -Eq '\.dmg$'; then
            echo "::error::Missing macOS DMG for Tavern-Born $RELEASE_VERSION."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Uploaded assets:"
            echo "$assets"
            exit 1
          fi
