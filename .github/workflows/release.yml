name: Release

on:
  # repository_dispatch always loads this workflow from the protected default branch.
  repository_dispatch:
    types: [release-merged, rebuild-release]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
  REVIEWED_HEAD_SHA: ${{ github.event.client_payload.reviewed_head_sha }}
  REBUILD_EXISTING_DRAFT: ${{ github.event.action == 'rebuild-release' }}

jobs:
  detect-version-change:
    name: Detect package version change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare package versions
        id: version
        shell: bash
        run: |
          current_version="$(node -p "require('./package.json').version")"
          previous_version="$(
            git show "$SOURCE_SHA^:package.json" |
              node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).version))'
          )"

          if [[ "$current_version" == "$previous_version" ]]; then
            if [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
              echo "Package version remains $current_version; rebuilding its unpublished draft."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Package version remains $current_version; skipping release."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
            echo "Draft rebuild mode is only valid when the package version is unchanged." >&2
            exit 1
          else
            echo "Package version changed from $previous_version to $current_version."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  release-source:
    name: Prepare release from merged PR
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The validation code comes from the workflow's protected revision,
          # never from the candidate release source.
          ref: ${{ github.workflow_sha || github.sha }}
          persist-credentials: false
          path: trusted
      - name: Require merged PR and clean Copilot review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          REVIEWED_HEAD_SHA: ${{ env.REVIEWED_HEAD_SHA }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: process.env.SOURCE_SHA, per_page: 100,
            });
            const pull = pulls.find((candidate) =>
              candidate.merged_at &&
              candidate.merge_commit_sha === process.env.SOURCE_SHA &&
              candidate.base.ref === 'main' &&
              candidate.head.ref === 'dev' &&
              candidate.head.repo.full_name === `${owner}/${repo}`,
            );
            if (!pull) throw new Error(`Commit ${process.env.SOURCE_SHA} did not come from a merged dev -> main PR.`);

            const pullCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pull.number, per_page: 100,
            });
            if (pullCommits.at(-1)?.sha !== process.env.REVIEWED_HEAD_SHA) {
              throw new Error(`${process.env.REVIEWED_HEAD_SHA} was not the final pre-merge commit in PR #${pull.number}.`);
            }

            const { join } = require('node:path');
            const { requireCopilotReview } = require(
              join(process.env.GITHUB_WORKSPACE, 'trusted/.github/scripts/copilot-review-gate.cjs'),
            );
            await requireCopilotReview({
              github,
              core,
              owner,
              repo,
              pullNumber: pull.number,
              expectedHead: process.env.REVIEWED_HEAD_SHA,
            });
      - name: Validate release version and changelog
        id: release
        shell: bash
        working-directory: source
        run: |
          mkdir -p ../release-metadata

          lookup_release_draft() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" --jq '.draft' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          lookup_tag_sha() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" --jq '.object.sha' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          version="$(node -p "require('./package.json').version")"
          previous_version="$(
            git show "$SOURCE_SHA^:package.json" |
              node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).version))'
          )"
          if [[ "$REBUILD_EXISTING_DRAFT" == "true" ]]; then
            node ../trusted/scripts/check-release.mjs --source-root . --notes-file ../release-metadata/release-notes.md
          else
            node ../trusted/scripts/check-release.mjs --source-root . --previous-version "$previous_version" --notes-file ../release-metadata/release-notes.md
          fi
          tag="v$version"

          if existing_sha="$(lookup_tag_sha "$tag")"; then
            if [[ "$existing_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $tag points to $existing_sha instead of $SOURCE_SHA; refusing to replace it." >&2
              exit 1
            fi
            echo "Tag $tag already points to the exact release source; it can be reused after an interrupted attempt."
          else
            tag_lookup_status=$?
            if [[ "$tag_lookup_status" -ne 4 ]]; then
              echo "Could not verify the state of tag $tag; refusing to continue." >&2
              exit 1
            fi
          fi

          if is_draft="$(lookup_release_draft "$tag")"; then
            if [[ "$REBUILD_EXISTING_DRAFT" == "true" && "$is_draft" == "true" ]]; then
              echo "Draft $tag still exists. Remove that unpublished draft before starting a rebuild." >&2
            else
              echo "Release $tag already exists; refusing to replace or modify it." >&2
            fi
            exit 1
          else
            lookup_status=$?
            if [[ "$lookup_status" -ne 4 ]]; then
              echo "Could not verify that release $tag is absent; refusing to continue." >&2
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Preserve validated release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-metadata/release-notes.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    name: Build (${{ matrix.os }})
    needs: release-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build artifacts and update manifests without publishing
        run: npm run dist -- --publish never
      - name: Preserve build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-release:
    name: Create and populate draft release
    needs: [release-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      - name: Download validated release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: release-metadata
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-build-*
          path: release-artifacts
          merge-multiple: true
      - name: Validate completed artifact bundle
        shell: bash
        run: |
          require_file() {
            if [[ ! -f "release-artifacts/$1" ]]; then
              echo "::error::Missing completed build artifact: $1"
              exit 1
            fi
          }

          require_manifest() {
            local manifest="$1"
            local expected="$2"
            local manifest_path="release-artifacts/$manifest"
            if [[ "$(grep -Fxc "path: $expected" "$manifest_path" || true)" -ne 1 ]] ||
               [[ "$(grep -Fxc "  - url: $expected" "$manifest_path" || true)" -ne 1 ]] ||
               ! grep -Eq '^sha512: [A-Za-z0-9+/=]+$' "$manifest_path"; then
              echo "::error::$manifest does not describe the expected artifact $expected."
              exit 1
            fi
          }

          require_file "Tavern-Born-Setup-$RELEASE_VERSION.exe"
          require_file "Tavern-Born-Setup-$RELEASE_VERSION.exe.blockmap"
          require_file "Tavern-Born-$RELEASE_VERSION-portable.exe"
          require_file "Tavern-Born-$RELEASE_VERSION.AppImage"
          require_file "tavern-born_${RELEASE_VERSION}_amd64.deb"
          require_file 'latest.yml'
          require_file 'latest-mac.yml'
          require_file 'latest-linux.yml'

          shopt -s nullglob
          dmg_files=(release-artifacts/Tavern-Born-"$RELEASE_VERSION"*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 || ! -f "${dmg_files[0]}.blockmap" ]]; then
            echo "::error::Expected exactly one macOS DMG and its blockmap."
            exit 1
          fi

          dmg_name="$(basename "${dmg_files[0]}")"
          require_manifest 'latest.yml' "Tavern-Born-Setup-$RELEASE_VERSION.exe"
          require_manifest 'latest-mac.yml' "$dmg_name"
          require_manifest 'latest-linux.yml' "Tavern-Born-$RELEASE_VERSION.AppImage"

          artifact_files=(release-artifacts/*)
          if [[ "${#artifact_files[@]}" -ne 10 ]]; then
            echo "::error::Expected exactly 10 release artifacts; found ${#artifact_files[@]}."
            printf '%s\n' "${artifact_files[@]}"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
      - name: Create tag and draft from completed artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          lookup_release() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          lookup_tag_sha() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          if release_state="$(lookup_release)"; then
            echo "Release $RELEASE_TAG already exists; refusing to replace or modify it." >&2
            exit 1
          else
            release_lookup_status=$?
            if [[ "$release_lookup_status" -ne 4 ]]; then
              echo "Could not verify that release $RELEASE_TAG is absent; refusing to continue." >&2
              exit 1
            fi
          fi

          if tag_sha="$(lookup_tag_sha)"; then
            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tag_sha instead of $SOURCE_SHA; refusing to replace it." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to the exact release source; resuming draft creation."
          else
            tag_lookup_status=$?
            if [[ "$tag_lookup_status" -ne 4 ]]; then
              echo "Could not verify the state of tag $RELEASE_TAG; refusing to continue." >&2
              exit 1
            fi

            # Creating a new ref is atomic: a concurrent tag or release wins and
            # this request fails without moving any existing tag.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA"
          fi

          gh release create "$RELEASE_TAG" release-artifacts/* \
            --draft --title "$RELEASE_TAG" \
            --notes-file release-metadata/release-notes.md --verify-tag

  verify-release:
    name: Verify draft release artifacts
    needs: [release-source, publish-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      - name: Verify draft and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"

          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG is not a draft."
            exit 1
          fi

          missing=0
          require_asset() {
            local expected="$1"
            if ! grep -Fxq "$expected" <<<"$assets"; then
              echo "::error::Missing release asset: $expected"
              missing=1
            fi
          }

          require_asset "Tavern-Born-Setup-$RELEASE_VERSION.exe"
          require_asset "Tavern-Born-Setup-$RELEASE_VERSION.exe.blockmap"
          require_asset "Tavern-Born-$RELEASE_VERSION-portable.exe"
          require_asset "Tavern-Born-$RELEASE_VERSION.AppImage"
          require_asset "tavern-born_${RELEASE_VERSION}_amd64.deb"
          require_asset 'latest.yml'
          require_asset 'latest-mac.yml'
          require_asset 'latest-linux.yml'

          dmg_assets=()
          while IFS= read -r asset; do
            if [[ "$asset" == Tavern-Born-"$RELEASE_VERSION"*.dmg ]]; then
              dmg_assets+=("$asset")
            fi
          done <<<"$assets"
          if [[ "${#dmg_assets[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one macOS DMG for Tavern-Born $RELEASE_VERSION."
            missing=1
          else
            require_asset "${dmg_assets[0]}.blockmap"
          fi

          asset_count="$(grep -c . <<<"$assets")"
          if [[ "$asset_count" -ne 10 ]]; then
            echo "::error::Expected exactly 10 release assets; found $asset_count."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Uploaded assets:"
            echo "$assets"
            exit 1
          fi
