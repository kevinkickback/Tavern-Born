name: Release

on:
  workflow_dispatch:
    inputs:
      replace_unpublished:
        description: Replace an unpublished tag or draft that targets another commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  REPLACE_UNPUBLISHED: ${{ inputs.replace_unpublished }}

jobs:
  release-source:
    name: Prepare manual release draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      initial_tag_state: ${{ steps.release.outputs.initial_tag_state }}
      initial_tag_sha: ${{ steps.release.outputs.initial_tag_sha }}
      initial_release_fingerprint: ${{ steps.release.outputs.initial_release_fingerprint }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Require the current main revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Release drafts must be created from main.');
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== process.env.SOURCE_SHA) {
              throw new Error('main changed before release preparation; run the workflow again.');
            }
      - name: Validate release version and changelog
        id: release
        shell: bash
        run: |
          mkdir -p release-metadata

          lookup_releases() {
            local output
            if output="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$1\") | [.id, .draft, .updated_at] | @tsv" 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            echo "$output" >&2
            return 1
          }

          lookup_tag_sha() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" --jq '.object.sha' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          version="$(node -p "require('./package.json').version")"
          node scripts/check-release.mjs --notes-file release-metadata/release-notes.md
          tag="v$version"

          tag_found=false
          if existing_sha="$(lookup_tag_sha "$tag")"; then
            tag_found=true
          else
            tag_lookup_status=$?
            if [[ "$tag_lookup_status" -ne 4 ]]; then
              echo "Could not verify the state of tag $tag; refusing to continue." >&2
              exit 1
            fi
          fi

          if ! release_info="$(lookup_releases "$tag")"; then
            echo "Could not enumerate releases for $tag; refusing to continue." >&2
            exit 1
          fi

          draft_count=0
          while IFS=$'\t' read -r release_id release_is_draft _release_updated_at; do
            [[ -z "$release_id" ]] && continue
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $tag is published; refusing to modify it." >&2
              exit 1
            fi
            draft_count=$((draft_count + 1))
          done <<<"$release_info"

          if [[ "$tag_found" == "true" && "$existing_sha" != "$SOURCE_SHA" &&
                "$REPLACE_UNPUBLISHED" != "true" ]]; then
            echo "Tag $tag points to $existing_sha instead of $SOURCE_SHA; enable replacement of the unpublished release to move it." >&2
            exit 1
          fi
          if [[ "$draft_count" -gt 0 ]]; then
            echo "$draft_count draft(s) for $tag will be replaced only after all new packages finish building."
          elif [[ "$tag_found" == "true" ]]; then
            echo "Tag $tag already exists; draft creation will resume after the builds finish."
          else
            echo "No tag or release exists for $tag; both will be created after the builds finish."
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release_fingerprint="$(printf '%s' "$release_info" | sort | sha256sum | cut -d' ' -f1)"
          echo "initial_release_fingerprint=$release_fingerprint" >> "$GITHUB_OUTPUT"
          if [[ "$tag_found" == "true" ]]; then
            echo "initial_tag_state=present" >> "$GITHUB_OUTPUT"
            echo "initial_tag_sha=$existing_sha" >> "$GITHUB_OUTPUT"
          else
            echo "initial_tag_state=missing" >> "$GITHUB_OUTPUT"
            echo "initial_tag_sha=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Preserve validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-metadata/release-notes.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    name: Build (${{ matrix.os }})
    needs: release-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build artifacts and update manifests without publishing
        run: npm run dist -- --publish never
      - name: Preserve build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-release:
    name: Create and populate draft release
    needs: [release-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
      INITIAL_TAG_STATE: ${{ needs.release-source.outputs.initial_tag_state }}
      INITIAL_TAG_SHA: ${{ needs.release-source.outputs.initial_tag_sha }}
      INITIAL_RELEASE_FINGERPRINT: ${{ needs.release-source.outputs.initial_release_fingerprint }}
    steps:
      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-metadata
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: release-artifacts
          merge-multiple: true
      - name: Validate completed artifact bundle
        shell: bash
        run: |
          require_file() {
            if [[ ! -f "release-artifacts/$1" ]]; then
              echo "::error::Missing completed build artifact: $1"
              exit 1
            fi
          }

          require_manifest() {
            local manifest="$1"
            local expected="$2"
            local manifest_path="release-artifacts/$manifest"
            if [[ "$(grep -Fxc "path: $expected" "$manifest_path" || true)" -ne 1 ]] ||
               [[ "$(grep -Fxc "  - url: $expected" "$manifest_path" || true)" -ne 1 ]] ||
               ! grep -Eq '^sha512: [A-Za-z0-9+/=]+$' "$manifest_path"; then
              echo "::error::$manifest does not describe the expected artifact $expected."
              exit 1
            fi
          }

          require_file "Tavern-Born-Setup-$RELEASE_VERSION.exe"
          require_file "Tavern-Born-Setup-$RELEASE_VERSION.exe.blockmap"
          require_file "Tavern-Born-$RELEASE_VERSION-portable.exe"
          require_file "Tavern-Born-$RELEASE_VERSION.AppImage"
          require_file "tavern-born_${RELEASE_VERSION}_amd64.deb"
          require_file 'latest.yml'
          require_file 'latest-mac.yml'
          require_file 'latest-linux.yml'

          shopt -s nullglob
          dmg_files=(release-artifacts/Tavern-Born-"$RELEASE_VERSION"*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 || ! -f "${dmg_files[0]}.blockmap" ]]; then
            echo "::error::Expected exactly one macOS DMG and its blockmap."
            exit 1
          fi

          dmg_name="$(basename "${dmg_files[0]}")"
          require_manifest 'latest.yml' "Tavern-Born-Setup-$RELEASE_VERSION.exe"
          require_manifest 'latest-mac.yml' "$dmg_name"
          require_manifest 'latest-linux.yml' "Tavern-Born-$RELEASE_VERSION.AppImage"

          artifact_files=(release-artifacts/*)
          if [[ "${#artifact_files[@]}" -ne 10 ]]; then
            echo "::error::Expected exactly 10 release artifacts; found ${#artifact_files[@]}."
            printf '%s\n' "${artifact_files[@]}"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
      - name: Replace or create draft from completed artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          lookup_releases() {
            local output
            if output="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft, .updated_at] | @tsv" 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            echo "$output" >&2
            return 1
          }

          assert_draft() {
            local release_id="$1"
            local state
            if ! state="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')"; then
              echo "Could not re-check release $RELEASE_TAG; refusing to modify it." >&2
              exit 1
            fi
            if [[ "$state" != "true" ]]; then
              echo "Release $RELEASE_TAG was published while this run was active; refusing to modify it." >&2
              exit 1
            fi
          }

          lookup_tag_sha() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          assert_current_main() {
            local current_main_sha
            if ! current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"; then
              echo "Could not verify the current main revision; refusing to continue." >&2
              exit 1
            fi
            if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
              echo "main changed while release artifacts were building; run the workflow again." >&2
              exit 1
            fi
          }

          assert_current_main

          if ! release_info="$(lookup_releases)"; then
            echo "Could not enumerate releases for $RELEASE_TAG; refusing to continue." >&2
            exit 1
          fi
          release_fingerprint="$(printf '%s' "$release_info" | sort | sha256sum | cut -d' ' -f1)"
          if [[ "$release_fingerprint" != "$INITIAL_RELEASE_FINGERPRINT" ]]; then
            echo "Release $RELEASE_TAG changed after release preparation; refusing to continue." >&2
            exit 1
          fi

          release_ids=()
          while IFS=$'\t' read -r release_id release_is_draft _release_updated_at; do
            [[ -z "$release_id" ]] && continue
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is published; refusing to modify it." >&2
              exit 1
            fi
            release_ids+=("$release_id")
          done <<<"$release_info"

          tag_found=false
          if tag_sha="$(lookup_tag_sha)"; then
            tag_found=true
          else
            tag_lookup_status=$?
            if [[ "$tag_lookup_status" -ne 4 ]]; then
              echo "Could not verify the state of tag $RELEASE_TAG; refusing to continue." >&2
              exit 1
            fi
          fi

          if [[ "$INITIAL_TAG_STATE" == "present" ]]; then
            if [[ "$tag_found" != "true" || "$tag_sha" != "$INITIAL_TAG_SHA" ]]; then
              echo "Tag $RELEASE_TAG changed after release preparation; refusing to continue." >&2
              exit 1
            fi
          elif [[ "$INITIAL_TAG_STATE" == "missing" ]]; then
            if [[ "$tag_found" == "true" ]]; then
              echo "Tag $RELEASE_TAG was created after release preparation; refusing to continue." >&2
              exit 1
            fi
          else
            echo "The initial tag state is unavailable; refusing to continue." >&2
            exit 1
          fi

          if [[ "$REPLACE_UNPUBLISHED" != "true" && "$tag_found" == "true" &&
                "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Tag $RELEASE_TAG points to $tag_sha instead of $SOURCE_SHA; enable replacement of the unpublished release to move it." >&2
            exit 1
          fi

          # Every replacement starts from one clean draft. This also repairs an
          # interrupted run that left duplicate unpublished drafts for the tag.
          assert_current_main
          for release_id in "${release_ids[@]}"; do
            assert_draft "$release_id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done

          if [[ "$REPLACE_UNPUBLISHED" == "true" && "$tag_found" == "true" &&
                "$tag_sha" != "$SOURCE_SHA" ]]; then
            if ! current_tag_sha="$(lookup_tag_sha)" || [[ "$current_tag_sha" != "$tag_sha" ]]; then
              echo "Tag $RELEASE_TAG changed while the release was building; refusing to delete it." >&2
              exit 1
            fi
            assert_current_main
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
            tag_found=false
          fi

          if [[ "$tag_found" != "true" ]]; then
            # Creating a new ref is atomic: a concurrent tag wins and this
            # request fails without moving any existing tag.
            assert_current_main
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA"
          fi

          if ! current_tag_sha="$(lookup_tag_sha)" || [[ "$current_tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Tag $RELEASE_TAG no longer points to $SOURCE_SHA; refusing to create a draft." >&2
            exit 1
          fi
          assert_current_main
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --draft --title "$RELEASE_TAG" \
            --notes-file release-metadata/release-notes.md --verify-tag

  verify-release:
    name: Verify draft release artifacts
    needs: [release-source, publish-release]
    runs-on: ubuntu-latest
    # GitHub exposes draft releases only to tokens with push access. This job
    # executes protected workflow code and performs read-only API calls.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-source.outputs.version }}
    steps:
      - name: Verify draft and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! release_info="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv")"; then
            echo "::error::Could not enumerate releases for $RELEASE_TAG."
            exit 1
          fi

          release_ids=()
          while IFS=$'\t' read -r release_id is_draft; do
            [[ -z "$release_id" ]] && continue
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is not a draft."
              exit 1
            fi
            release_ids+=("$release_id")
          done <<<"$release_info"

          if [[ "${#release_ids[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one draft for $RELEASE_TAG; found ${#release_ids[@]}."
            exit 1
          fi

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/${release_ids[0]}" --jq '.assets[].name')"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG points to $tag_sha instead of $SOURCE_SHA."
            exit 1
          fi

          missing=0
          require_asset() {
            local expected="$1"
            if ! grep -Fxq "$expected" <<<"$assets"; then
              echo "::error::Missing release asset: $expected"
              missing=1
            fi
          }

          require_asset "Tavern-Born-Setup-$RELEASE_VERSION.exe"
          require_asset "Tavern-Born-Setup-$RELEASE_VERSION.exe.blockmap"
          require_asset "Tavern-Born-$RELEASE_VERSION-portable.exe"
          require_asset "Tavern-Born-$RELEASE_VERSION.AppImage"
          require_asset "tavern-born_${RELEASE_VERSION}_amd64.deb"
          require_asset 'latest.yml'
          require_asset 'latest-mac.yml'
          require_asset 'latest-linux.yml'

          dmg_assets=()
          while IFS= read -r asset; do
            if [[ "$asset" == Tavern-Born-"$RELEASE_VERSION"*.dmg ]]; then
              dmg_assets+=("$asset")
            fi
          done <<<"$assets"
          if [[ "${#dmg_assets[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one macOS DMG for Tavern-Born $RELEASE_VERSION."
            missing=1
          else
            require_asset "${dmg_assets[0]}.blockmap"
          fi

          asset_count="$(grep -c . <<<"$assets")"
          if [[ "$asset_count" -ne 10 ]]; then
            echo "::error::Expected exactly 10 release assets; found $asset_count."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Uploaded assets:"
            echo "$assets"
            exit 1
          fi
