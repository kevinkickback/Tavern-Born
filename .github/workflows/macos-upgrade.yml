name: Stage macOS upgrades

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/macos-upgrade.yml
      - .github/workflows/release.yml
      - electron/updateManager.ts
      - scripts/ci/*macos*

permissions:
  contents: read

concurrency:
  group: macos-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Inspect the exact published v0.6.0 macOS bundle
        run: |
          test "$(uname -m)" = arm64
          legacy="$RUNNER_TEMP/Tavern-Born-0.6.0-arm64.dmg"
          curl --fail --location --retry 3 --output "$legacy" \
            https://github.com/kevinkickback/Tavern-Born/releases/download/v0.6.0/Tavern-Born-0.6.0-arm64.dmg
          printf '%s  %s\n' af3ff2cb863d7df3935e7d998fd07987ebb784de86c0c64508a8e24c5bc1a98b "$legacy" | shasum -a 256 -c
          mount="$RUNNER_TEMP/tb-legacy-dmg"
          mkdir -p "$mount" "$RUNNER_TEMP/tb-legacy"
          hdiutil attach -mountpoint "$mount" -readonly -nobrowse "$legacy"
          trap 'hdiutil detach "$mount"' EXIT
          app="$RUNNER_TEMP/tb-legacy/Tavern-Born.app"
          ditto "$mount/Tavern-Born.app" "$app"
          codesign -dvv -r- "$app"
          if codesign --verify --deep --strict --verbose=2 "$app"; then
            echo 'Published v0.6.0 passed native signature verification.'
          else
            echo 'Published v0.6.0 failed native signature verification.'
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle -- --require-srd
      - name: Build and exercise two versions with one test signing identity
        shell: bash
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_NAME: Tavern-Born CI
          TB_STAGING_PORT: '42857'
        run: |
          # This key signs disposable artifacts and lives only in the hosted runner.
          signing="$(mktemp -d)"
          export CSC_KEYCHAIN="$signing/test.keychain-db"
          keychain_list="$(security list-keychains -d user)"
          original_keychains=()
          while IFS= read -r path; do
            original_keychains+=("$path")
          done < <(printf '%s\n' "$keychain_list" | sed -nE 's/^[[:space:]]*"(.*)"[[:space:]]*$/\1/p')
          cleanup() {
            security list-keychains -d user -s "${original_keychains[@]}" || true
            security delete-keychain "$CSC_KEYCHAIN" 2>/dev/null || true
            rm -f "$signing/key.pem" "$signing/cert.pem" "$signing/key.p12" "$signing/cert.cnf" "$signing/probe"
          }
          trap cleanup EXIT
          umask 077
          cat > "$signing/cert.cnf" <<'EOF'
          [req]
          distinguished_name = subject
          prompt = no
          x509_extensions = codesign
          [subject]
          CN = Tavern-Born CI
          [codesign]
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          EOF
          openssl req -newkey rsa:2048 -nodes -x509 -days 1 -config "$signing/cert.cnf" \
            -keyout "$signing/key.pem" -out "$signing/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$signing/cert.pem"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          export keychain_password
          openssl pkcs12 -export -out "$signing/key.p12" -inkey "$signing/key.pem" \
            -in "$signing/cert.pem" -passout env:keychain_password -legacy
          security create-keychain -p "$keychain_password" "$CSC_KEYCHAIN"
          security list-keychains -d user -s "$CSC_KEYCHAIN" "${original_keychains[@]}"
          security set-keychain-settings -lut 7200 "$CSC_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CSC_KEYCHAIN"
          security import "$signing/key.p12" -k "$CSC_KEYCHAIN" -P "$keychain_password" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$CSC_KEYCHAIN" >/dev/null
          unset keychain_password
          printf 'int main(void) { return 0; }\n' | clang -x c -o "$signing/probe" -
          codesign --force --sign "$CSC_NAME" --keychain "$CSC_KEYCHAIN" --timestamp=none "$signing/probe"

          pack() {
            local version="$1"
            local output="$2"
            npx --no-install electron-builder --mac --arm64 --publish never \
              -c.extraMetadata.version="$version" -c.directories.output="$output" \
              -c.mac.publish.provider=generic -c.mac.publish.url="http://127.0.0.1:$TB_STAGING_PORT" \
              -c.mac.forceCodeSigning=true -c.mac.timestamp=none \
              -c.mac.preAutoEntitlements=false -c.mac.hardenedRuntime=false -c.mac.notarize=false
          }

          pack 0.7.0 "$RUNNER_TEMP/tb-staged-base"
          pack 0.7.1 "$RUNNER_TEMP/tb-staged-next"
          app="$RUNNER_TEMP/tb-staged-base/mac-arm64/Tavern-Born.app"
          next="$RUNNER_TEMP/tb-staged-next"
          codesign --verify --deep --strict "$app"
          node scripts/ci/smoke-macos-upgrade.mjs "$app" "$next" 0.7.0 0.7.1
      - name: Check the staged ZIP against the published app's update requirement
        shell: bash
        run: |
          legacy="$RUNNER_TEMP/tb-legacy/Tavern-Born.app"
          requirement="$(codesign -d -r- "$legacy" 2>&1 | sed -nE 's/^(# )?designated => //p')"
          test -n "$requirement"
          stage="$RUNNER_TEMP/tb-staged-base"
          test -s "$stage/Tavern-Born-0.7.0-arm64.dmg"
          test -s "$stage/Tavern-Born-0.7.0-arm64.dmg.blockmap"
          test -s "$stage/Tavern-Born-0.7.0-arm64-mac.zip.blockmap"
          mkdir -p "$RUNNER_TEMP/tb-staged"
          ditto -x -k "$stage/Tavern-Born-0.7.0-arm64-mac.zip" "$RUNNER_TEMP/tb-staged"
          staged="$RUNNER_TEMP/tb-staged/Tavern-Born.app"
          codesign --verify --deep --strict --all-architectures "$staged"
          codesign -dvv -r- "$staged"
          cat "$stage/latest-mac.yml"
          if codesign --verify --deep --strict --all-architectures --test-requirement "=$requirement" "$staged"; then
            echo 'Unexpectedly, the staged ZIP satisfies the exact v0.6.0 code requirement.'
            exit 1
          else
            echo 'The staged ZIP failed the exact v0.6.0 code requirement.'
          fi
