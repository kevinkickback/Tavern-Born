name: Merge reviewed dev changes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  trusted-quality:
    name: Trusted lint, type-check, coverage, and build
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.event.workflow_run.pull_requests[0].head.ref == 'dev' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc -b
      - run: npm run test:coverage
      - run: npm run build

  trusted-e2e:
    name: Trusted browser and desktop tests
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.event.workflow_run.pull_requests[0].head.ref == 'dev' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run test:electron

  squash-merge:
    name: Secure squash merge dev into main
    needs: [trusted-quality, trusted-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      reviewed-head-sha: ${{ steps.merge.outputs.reviewed-head-sha }}
    steps:
      # workflow_run loads this workflow from the protected default branch. Keep the
      # write-capable job isolated from the pull request checkout and its scripts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require clean Copilot review and merge the checked revision
        id: merge
        timeout-minutes: 16
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const associatedPulls = run.pull_requests ?? [];
            if (associatedPulls.length !== 1) {
              throw new Error(`Expected one pull request for CI run ${run.id}; found ${associatedPulls.length}.`);
            }

            const testedPull = associatedPulls[0];
            const pullNumber = testedPull.number;
            const testedHead = testedPull.head.sha;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber,
            });
            if (pr.head.sha !== testedHead) {
              throw new Error('The PR changed; its latest CI run must pass before merging.');
            }
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'dev' || pr.head.repo.full_name !== `${owner}/${repo}`) {
              throw new Error('The PR is not an eligible dev to main merge.');
            }

            const { join } = require('node:path');
            const { requireCopilotReview } = require(
              join(process.env.GITHUB_WORKSPACE, '.github/scripts/copilot-review-gate.cjs'),
            );
            await requireCopilotReview({
              github,
              core,
              owner,
              repo,
              pullNumber,
              expectedHead: testedHead,
              timeoutMs: 15 * 60 * 1000,
            });

            const { data: reviewedPr } = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber,
            });
            if (reviewedPr.head.sha !== testedHead) {
              throw new Error('The PR changed during review; its latest CI run must pass before merging.');
            }
            if (reviewedPr.state !== 'open' || reviewedPr.draft || reviewedPr.base.ref !== 'main' ||
                reviewedPr.head.ref !== 'dev' || reviewedPr.head.repo.full_name !== `${owner}/${repo}`) {
              throw new Error('The PR is no longer an eligible dev to main merge.');
            }

            const { data: currentBase } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (reviewedPr.base.sha !== testedPull.base.sha || currentBase.commit.sha !== testedPull.base.sha) {
              throw new Error('main changed during review; update the PR and rerun CI before merging.');
            }

            // Main Protection uses strict required checks, so GitHub atomically rejects
            // this merge if main advances after the preflight comparison above.
            const { data: result } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              merge_method: 'squash',
              sha: testedHead,
            });
            if (!result.merged) throw new Error(result.message);
            core.setOutput('sha', result.sha);
            core.setOutput('reviewed-head-sha', testedHead);

  release:
    name: Release merged version
    needs: squash-merge
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    # A token-authenticated merge does not emit a new push workflow, so invoke
    # the reusable release workflow from this trusted workflow revision.
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ needs.squash-merge.outputs.sha }}
      reviewed-head-sha: ${{ needs.squash-merge.outputs.reviewed-head-sha }}
