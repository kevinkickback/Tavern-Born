name: Merge reviewed dev changes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

jobs:
  squash-merge:
    name: Secure squash merge dev into main
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # workflow_run loads this workflow from the protected default branch. Keep the
      # write-capable job isolated from the pull request checkout and its scripts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Require clean Copilot review and merge the checked revision
        id: merge
        timeout-minutes: 16
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const associatedPulls = run.pull_requests ?? [];
            if (associatedPulls.length !== 1) {
              throw new Error(`Expected one pull request for CI run ${run.id}; found ${associatedPulls.length}.`);
            }

            const pullNumber = associatedPulls[0].number;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber,
            });
            if (pr.head.sha !== run.head_sha) {
              throw new Error('The PR changed; its latest CI run must pass before merging.');
            }
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.head.ref !== 'dev' || pr.head.repo.full_name !== `${owner}/${repo}`) {
              throw new Error('The PR is not an eligible dev to main merge.');
            }

            const { requireCopilotReview } = require('./.github/scripts/copilot-review-gate.cjs');
            await requireCopilotReview({
              github,
              core,
              owner,
              repo,
              pullNumber,
              expectedHead: run.head_sha,
              requestReview: true,
              timeoutMs: 15 * 60 * 1000,
            });

            const { data: currentBase } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (currentBase.commit.sha !== pr.base.sha) {
              throw new Error('main changed during review; update the PR and rerun CI before merging.');
            }

            const { data: result } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              merge_method: 'squash',
              sha: run.head_sha,
            });
            if (!result.merged) throw new Error(result.message);
            core.setOutput('sha', result.sha);

  release:
    name: Release merged version
    needs: squash-merge
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    # A token-authenticated merge does not emit a new push workflow, so invoke
    # the reusable release workflow from this trusted workflow revision.
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ needs.squash-merge.outputs.sha }}
