name: Temporary SRD Package Verification

# Remove this workflow and scripts/verify-packaged-srd.mjs after one successful native run on all
# three platforms. Future verification is required only when SRD or packaging configuration changes.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify-native-package:
    name: Verify SRD package (${{ matrix.os }})
    if: '!github.event.pull_request.draft'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build native packages without publishing
        run: npm run dist -- --publish never
      - name: Locate Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem -Path release -Recurse -File -Filter Tavern-Born.exe |
            Where-Object { $_.FullName -match '[\\/]win-unpacked[\\/]' } |
            Select-Object -First 1
          if (-not $executable) { throw 'Could not find the unpacked Windows executable.' }
          "TAVERN_BORN_PACKAGED_EXECUTABLE=$($executable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGED_RESOURCES_DIR=$(Join-Path $executable.DirectoryName 'resources')" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Locate macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find release -type d -name 'Tavern-Born.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Could not find the packaged macOS application." >&2
            exit 1
          fi
          echo "TAVERN_BORN_PACKAGED_EXECUTABLE=$PWD/$app_path/Contents/MacOS/Tavern-Born" >> "$GITHUB_ENV"
          echo "PACKAGED_RESOURCES_DIR=$PWD/$app_path/Contents/Resources" >> "$GITHUB_ENV"
      - name: Locate Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          executable="$(find release -path '*/linux-unpacked/*' -type f -name 'tavern-born' -perm -111 -print -quit)"
          if [[ -z "$executable" ]]; then
            echo "Could not find the unpacked Linux executable." >&2
            exit 1
          fi
          echo "TAVERN_BORN_PACKAGED_EXECUTABLE=$PWD/$executable" >> "$GITHUB_ENV"
          echo "PACKAGED_RESOURCES_DIR=$PWD/$(dirname "$executable")/resources" >> "$GITHUB_ENV"
      - name: Verify packaged SRD files and application contents
        run: node scripts/verify-packaged-srd.mjs
      - name: Exercise Included SRD in the packaged application
        if: runner.os != 'Linux'
        run: npm run test:electron -- bundledSrdJourney.ts
      - name: Exercise Included SRD in the packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:electron -- bundledSrdJourney.ts
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-srd-package-diagnostics-${{ matrix.os }}
          path: |
            playwright-report
            test-results
            release/builder-debug.yml
          if-no-files-found: ignore
          overwrite: true
